name: Build and publish Jeep AA Diagnostic
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jeep-aa-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.JEEP_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.JEEP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JEEP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.JEEP_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo "::error::Missing signing secret"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jeep-release.jks"
          echo "JEEP_KEYSTORE_PATH=$RUNNER_TEMP/jeep-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          JEEP_KEYSTORE_PASSWORD: ${{ secrets.JEEP_KEYSTORE_PASSWORD }}
          JEEP_KEY_ALIAS: ${{ secrets.JEEP_KEY_ALIAS }}
          JEEP_KEY_PASSWORD: ${{ secrets.JEEP_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Monotonic across future runs; deliberately greater than old manually tagged v3-v5.
          version="$((1000 + GITHUB_RUN_NUMBER))"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          gradle --no-daemon :app:assembleRelease -PreleaseCode="$version" -PreleaseName="$version"
          cp app/build/outputs/apk/release/app-release.apk Jeep-AA-Diagnostic.apk
          sha256sum Jeep-AA-Diagnostic.apk > Jeep-AA-Diagnostic.apk.sha256
      - name: Publish release only after successful build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" Jeep-AA-Diagnostic.apk Jeep-AA-Diagnostic.apk.sha256 \
            --target "$GITHUB_SHA" --title "Jeep AA Diagnostic $RELEASE_TAG" --generate-notes --latest
